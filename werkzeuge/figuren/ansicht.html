<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Figuren-Ansicht</title>
<style>html,body{margin:0;height:100%;background:#8a9aa6}canvas{display:block;width:100%;height:100%}</style>
<script type="importmap">{ "imports": { "three": "../../vendor/three/three.module.min.js", "three/addons/": "../../vendor/three/addons/" } }</script>
</head><body><canvas id="c"></canvas>
<script type="module">
// Prüfansicht für die Figuren: ?figur=er&bewegung=gehen&zeit=0.5&blick=vorne
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const figur = q.get('figur') ?? 'er', bewegung = q.get('bewegung'), zeit = Number(q.get('zeit') ?? 0);
const blick = q.get('blick') ?? 'vorne', nah = q.get('nah') ?? '';
// Formziele (Charakter-Editor): ?formen=nase_gross=1+haar_1=1; ein Eintrag mit Minus blendet ein Netz aus (-er-haare_lang)
const eintraege = (q.get('formen') ?? '').split('+').filter(Boolean);
const aus = eintraege.filter((f) => f.startsWith('-')).map((f) => f.slice(1));
const formen = Object.fromEntries(eintraege.filter((f) => !f.startsWith('-')).map((f) => { const [n, w] = f.split('='); return [n, Number(w ?? 1)]; }));
const flaeche = document.getElementById('c');
const r = new THREE.WebGLRenderer({ canvas: flaeche, antialias: true });
r.setSize(innerWidth, innerHeight, false);
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.0;
r.shadowMap.enabled = true;
const s = new THREE.Scene();
s.background = new THREE.Color(0x8a9aa6);
s.add(new THREE.HemisphereLight(0xdfe8f0, 0x5a5040, 1.2));
const sonne = new THREE.DirectionalLight(0xfff2e0, 2.5); sonne.position.set(2, 4, 3); sonne.castShadow = true; sonne.shadow.normalBias = 0.02; sonne.shadow.bias = -0.0005; // wie im Spiel: ohne das zeigen sich Schattenflecken auf der Haut s.add(sonne);
const boden = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ color: 0x6b6a5a }));
boden.rotation.x = -Math.PI / 2; boden.receiveShadow = true; s.add(boden);
const k = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 50);
const ziele = { vorne: [0, 1, 4.2], seite: [4.2, 1, 0], hinten: [0, 1, -4.2], schraeg: [2.8, 1.3, 3.2] };
const [x, y, z] = ziele[blick];
function zielen(mitte, abstand) {
  k.position.set(mitte.x + x * abstand, mitte.y + (y - 1) * abstand, mitte.z + z * abstand);
  k.lookAt(mitte);
}
zielen(new THREE.Vector3(0, 0.95, 0), 1);
new GLTFLoader().load(`../../assets/figuren/${figur}.glb`, (g) => {
  g.scene.traverse((o) => {
    if (aus.includes(o.name)) o.visible = false;
    if (q.has('nurhaut') && o.isMesh && !['haut', 'auge', 'hornhaut'].includes(o.material.name)) o.visible = false;
    if (o.isMesh) (window.netze ??= []).push(`${o.name}:${o.material.name}:${o.geometry.attributes.position.count}`);
    if (!o.isMesh) return;
    // Haut: Der B-Kanal des ORM-Bilds ist die Haarfarben-Maske, kein Metall (wie im Spiel, src/spieler/figur.js)
    if (o.material.name === 'haut') { o.material.metalnessMap = null; o.material.metalness = 0; if (q.has('ohnenormal')) o.material.normalMap = null; if (q.has('flach')) o.material.flatShading = true; if (q.has('ohnefarbe')) { o.material.map = null; } if (q.has('ohneao')) { o.material.aoMap = null; o.material.roughnessMap = null; } if (q.has('neunormal')) { o.geometry.deleteAttribute('normal'); o.geometry.computeVertexNormals(); } }
    o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false;
    for (const [n, w] of Object.entries(formen)) if (o.morphTargetDictionary?.[n] !== undefined) o.morphTargetInfluences[o.morphTargetDictionary[n]] = w;
  });
  const namen = new Set();
  g.scene.traverse((o) => { for (const n of Object.keys(o.morphTargetDictionary ?? {})) namen.add(n); });
  window.formen = [...namen];
  s.add(g.scene);
  if (bewegung) {
    const m = new THREE.AnimationMixer(g.scene);
    const clip = g.animations.find((a) => a.name === bewegung);
    if (clip) { m.clipAction(clip).play(); m.setTime(zeit * clip.duration); }
    window.clips = g.animations.map((a) => `${a.name}:${a.duration.toFixed(2)}`);
  }
  g.scene.updateMatrixWorld(true);
  const knochen = (n) => g.scene.getObjectByName(n)?.getWorldPosition(new THREE.Vector3());
  if (nah === 'kopf') zielen(knochen('head').add(new THREE.Vector3(0, 0.07, 0)), 0.16);
  if (nah === 'oben') zielen(knochen('spine_03').add(new THREE.Vector3(0, 0.1, 0)), 0.42);
  r.render(s, k);
  window.fertig = true;
}, undefined, (e) => { window.fehler = String(e); window.fertig = true; });
</script></body></html>
